name: Nightly Benchmark Run

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM every day
  workflow_dispatch: # Allow manual trigger

# audit_09 #8: these used to be two steps of one job, with the private-corpus
# checkout first. `repository: your-org/dinero-benchmarks` is still a
# placeholder (see the quality-gates job), so that checkout has been failing
# every night — and because it was step 2 of a single job, it took the
# *corpus-independent* reconciliation regression gate down with it. Neither
# gate has ever actually run, which is exactly the "regression is invisible"
# outcome the finding describes, one level deeper than it looked.
#
# Split into two jobs so the placeholder only blocks what genuinely needs the
# corpus. The reconciliation gate depends on nothing external and runs tonight.

jobs:
  reconciliation-regression:
    # Doc 30 TASK-DEDUP-010: the reconciliation engine's own false-merge /
    # false-separation rate gate. Its fixtures live in this repo, so it must
    # not be coupled to the private-corpus checkout.
    name: Reconciliation Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run Reconciliation Regression Suite
        run: cargo test --test reconciliation_regression -- --nocapture
        working-directory: src-tauri

  quality-gates:
    # Requires the private labelled-email corpus. `repository:` below is a
    # PLACEHOLDER — this job cannot pass until it names the real corpus repo
    # and BENCHMARK_REPO_TOKEN is set in repository secrets.
    #
    # Deliberately left failing rather than skipped: phase10_quality_gates_tests
    # already refuses to pass when BENCHMARK_CORPUS_DIR is unset under CI,
    # precisely so an unprovisioned corpus can never look like a green gate.
    name: Run Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout Benchmark Corpus
        uses: actions/checkout@v7
        with:
          # TODO(corpus): replace with the real corpus repository.
          repository: your-org/dinero-benchmarks
          path: dinero-benchmarks
          lfs: true
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run Quality Gate Tests
        run: cargo test phase10_quality_gates -- --nocapture
        working-directory: src-tauri
        env:
          BENCHMARK_CORPUS_DIR: ${{ github.workspace }}/dinero-benchmarks
          BENCHMARK_REPORT_DIR: ${{ github.workspace }}/benchmark-reports

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-${{ github.run_id }}
          path: benchmark-reports/
          retention-days: 90
