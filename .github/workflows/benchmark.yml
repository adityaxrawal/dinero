name: Nightly Benchmark Run

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM every day
  workflow_dispatch: # Allow manual trigger

# Nightly reconciliation regression gate (TASK-DEDUP-010). Its fixtures live
# in this repo. The extraction quality gate needs the private labelled corpus
# and runs locally only (audit F-4).

jobs:
  reconciliation-regression:
    # Doc 30 TASK-DEDUP-010: the reconciliation engine's own false-merge /
    # false-separation rate gate. Its fixtures live in this repo, so it must
    # not be coupled to the private-corpus checkout.
    name: Reconciliation Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run Reconciliation Regression Suite
        run: cargo test --test reconciliation_regression -- --nocapture
        working-directory: src-tauri

  # The extraction quality gate (phase10_quality_gates, TASK-TXN-014) needs
  # the private labelled corpus, which stays on the owner's machine (audit
  # F-4): run it locally with `cargo test phase10_quality_gates`.
