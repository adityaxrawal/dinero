name: React CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    name: React Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # K5 fix: previously Node 22/pnpm 10 here vs Node 20/pnpm 9 in
          # rust.yml's build job — two divergent toolchain pins for the same
          # frontend. Standardized on the pin already used to build releases.
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm lint
      - name: Run TypeScript typecheck
        run: pnpm typecheck
      # K1 fix: no frontend unit-test layer existed at all — only Playwright
      # E2E specs, despite an 80%-line-coverage target.
      - name: Run unit tests
        run: pnpm test
      # K4 fix: dependency-vulnerability scanning was cited as "Resolved"
      # (Doc 39 §7, Doc 48 ADR-014) but no audit step actually ran.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
      - name: Run WCAG Accessibility Audit
        run: npx @axe-core/cli --tags wcag2aa --exit
