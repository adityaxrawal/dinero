[package]
name = "dinero-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "dinero-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dinero_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
# Doc 30 TASK-API-004: statements_upload's real contract needs file *bytes*
# (Document 19 §9.1), not paths -- the frontend's dialog-based file picker
# only ever returns paths. Scoped via the `fs:allow-read-file` capability
# permission (tauri.conf.json) rather than a broad filesystem grant --
# Tauri v2 auto-scopes read access to paths returned by a prior
# `dialog:open` call when paired with this plugin.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.38", features = ["bundled-sqlcipher", "chrono", "serde_json"] }
keyring = "3"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v5"] }
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
oauth2 = "4.4"
tiny_http = "0.12"
futures-util = "0.3"

pdfium-render = "0.8"
regex = "1.10"
chrono = "0.4"
sha2 = "0.10"
sysinfo = "0.39"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
deadpool-sqlite = "0.13.0"
url = "2.5.8"
tokio-util = { version = "0.7.18", features = ["full"] }
base64 = "0.22.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2"
# TASK-DESK-002: OS-level notifications via UNUserNotificationCenter.
tauri-plugin-notification = "2"
aes-gcm = "0.10"
strsim = "0.11"
jsonwebtoken = "9"
machine-uid = "0.5"
bip39 = "2"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sqlx = { version = "0.9.0", features = ["sqlite", "migrate", "runtime-tokio"] }
tauri-plugin-autostart = "2"
battery = "0.7"
unicode-security = "0.1.2"
# Sanitizes source-email HTML for display in the password-prompt modal
# (Doc 30 TASK-FE-012 follow-up) -- strips scripts/event-handlers/forms and,
# deliberately, all <img> tags (remote images in a fetched bank email are a
# tracking-pixel vector this offline-first app doesn't want to phone home
# for) while keeping layout/typography tags so the rendered email still
# looks like the original.
ammonia = "4"
unicode-normalization = "0.1.25"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
mockito = "1.0"
# TASK-QA-005: `#[tokio::test(start_paused = true)]` fast-forwards virtual
# time so a test can exercise the real exponential-backoff retry logic
# (which otherwise sleeps for real, summing to ~3 minutes across 8 retries)
# without weakening or duplicating that logic. Dev-only -- never ships.
tokio = { version = "1", features = ["test-util"] }

# `tauri dev` runs an unoptimized build, and the scan's hot path is almost
# entirely dependency code -- regex matching in the extraction ladder,
# serde_json over Gmail payloads, html5ever/ammonia sanitizing email bodies,
# SQLCipher key derivation. Unoptimized, those run roughly an order of
# magnitude slower than in release, which is why a dev-mode scan felt so much
# worse than the shipped one. Optimizing dependencies while leaving our own
# crate at opt-level 1 keeps breakpoints and backtraces usable; dependencies
# are rebuilt rarely, so this costs a one-time build, not iteration speed.
[profile.dev]
opt-level = 1


