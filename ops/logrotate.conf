# Doc 30 TASK-OPS-007: Log Rotation, Retention, and Redaction Policies.
#
# Neither Dinero surface is a traditional long-running Linux server process
# that a `logrotate` daemon would actually manage:
#   - The desktop app rotates/prunes app-logs.log itself, in-process, via
#     `tracing_appender::rolling::daily` + `logging::prune_old_logs`
#     (src-tauri/src/logging.rs) -- daily rotation, 15-day default retention
#     (DINERO_LOG_RETENTION_DAYS overridable), redacted at write time via
#     RedactingWriter.
#   - The Licensing Backend runs on Vercel Serverless, which captures stdout
#     directly (console.log) -- there is no persistent log file on disk for
#     a logrotate daemon to manage; retention is Vercel's own platform log
#     retention window, not something this repo configures.
#
# This file exists as documentation of the EQUIVALENT retention policy in
# logrotate's familiar syntax, for anyone auditing this task against a
# conventional ops checklist -- it is not wired into any real cron job or
# logrotate invocation, and should not be copied into /etc/logrotate.d/
# expecting it to do anything on this architecture.

# Desktop app-logs.log (equivalent policy -- actually enforced by
# src-tauri/src/logging.rs, not by this file):
#   rotate: daily (already handled by tracing_appender)
#   retention: 15 days (DINERO_LOG_RETENTION_DAYS)
#   compress: no (files are small; not worth the added complexity)

# Desktop crash reports (equivalent policy -- actually enforced by
# src-tauri/src/crash_reporter.rs's CRASH_REPORT_RETENTION_DAYS):
#   retention: 7 days, separate from operational logs per Doc30's explicit
#   "separate retention for diagnostic bundles vs. operational logs"

# Desktop diagnostic bundle exports (exports/*.zip): NOT auto-pruned. These
# are user-initiated exports (Settings > Export Diagnostic Bundle), treated
# like any other user-generated file the user chooses when/whether to
# delete -- auto-deleting a file the user explicitly exported would be
# surprising and unwanted.

# Licensing Backend structured request logs (request_id/endpoint/status/
# latency_ms only -- see licensing-backend/lib/request_logging.ts):
#   retention: governed by Vercel's platform log retention, not by this repo
